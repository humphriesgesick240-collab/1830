<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1830 맨체스터: 연기와 기계의 도시</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Playfair Display & Noto Serif KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coal: {
              900: '#121214',
              800: '#1b1b1f',
              700: '#2a2b30'
            },
            sepia: {
              100: '#f8f4eb',
              200: '#efe6d5',
              300: '#dfd2b9',
              800: '#534331',
              900: '#382a1c'
            },
            vintageGold: '#c59b27',
            rustRed: '#9e3223',
            steamBlue: '#4b6584'
          },
          fontFamily: {
            serif: ['"Noto Serif KR"', 'serif'],
            vintage: ['"Cinzel"', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #121214;
      color: #efe6d5;
      font-family: 'Noto Serif KR', serif;
      -webkit-tap-highlight-color: transparent;
    }
    .vintage-border {
      border: 1px solid #534331;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6), 0 4px 10px rgba(0,0,0,0.5);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #534331;
      border-radius: 4px;
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(0.99); }
    }
    .atmosphere-pulse {
      animation: pulse-subtle 4s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-center p-2 sm:p-4">

  <!-- 메인 모바일 래퍼 컨테이너 -->
  <main id="app-container" class="w-full max-w-md bg-coal-800 rounded-2xl overflow-hidden shadow-2xl vintage-border relative flex flex-col min-h-[92vh]">
    
    <!-- 배경 텍스처 오버레이 -->
    <div class="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(#d5b682_1px,transparent_1px)] [background-size:16px_16px]"></div>

    <!-- 헤더 / 상태 표시창 (HUD) -->
    <header id="game-hud" class="hidden relative z-10 bg-coal-900 border-b border-sepia-800 px-4 py-3 text-xs">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <span id="hud-role-icon" class="text-vintageGold text-sm"></span>
          <span id="hud-role-name" class="font-bold text-sepia-200 tracking-wide"></span>
        </div>
        <div class="px-2 py-0.5 rounded bg-sepia-900 text-vintageGold font-bold text-[11px] border border-sepia-800">
          <span id="hud-round-label">Round 1 / 4</span>
        </div>
      </div>
      <!-- 스탯 게이지 바 -->
      <div class="grid grid-cols-3 gap-2">
        <div>
          <div class="flex justify-between text-[10px] text-gray-400 mb-0.5">
            <span id="stat1-name">체력</span>
            <span id="stat1-val">80</span>
          </div>
          <div class="w-full bg-coal-700 h-1.5 rounded-full overflow-hidden">
            <div id="stat1-bar" class="bg-rustRed h-full transition-all duration-500" style="width: 80%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between text-[10px] text-gray-400 mb-0.5">
            <span id="stat2-name">자금</span>
            <span id="stat2-val">50</span>
          </div>
          <div class="w-full bg-coal-700 h-1.5 rounded-full overflow-hidden">
            <div id="stat2-bar" class="bg-vintageGold h-full transition-all duration-500" style="width: 50%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between text-[10px] text-gray-400 mb-0.5">
            <span id="stat3-name">불만/분노</span>
            <span id="stat3-val">40</span>
          </div>
          <div class="w-full bg-coal-700 h-1.5 rounded-full overflow-hidden">
            <div id="stat3-bar" class="bg-steamBlue h-full transition-all duration-500" style="width: 40%"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- 스크린 1: 시작 & 역할 선택 화면 -->
    <section id="screen-start" class="relative z-10 flex-1 flex flex-col justify-between p-5 text-center overflow-y-auto custom-scroll">
      <div class="my-auto py-2">
        <div class="inline-block px-3 py-1 mb-2 border border-vintageGold/40 rounded-full text-vintageGold text-xs uppercase tracking-widest font-vintage">
          Manchester 1830
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-sepia-100 tracking-tight mb-2">
          연기와 기계의 도시
        </h1>
        <p class="text-xs text-sepia-300 leading-relaxed mb-5 max-w-xs mx-auto">
          19세기 증기기관의 굉음과 검은 연기가 뒤덮인 맨체스터. 거대한 자본주의의 소용돌이 속에서 당신은 어떤 선택을 내리겠습니까?
        </p>

        <!-- 캐릭터 선택 안내 -->
        <h2 class="text-xs font-bold text-vintageGold uppercase tracking-wider mb-3">체험할 인물을 선택하세요</h2>
        <div class="grid grid-cols-2 gap-2 text-left mb-4" id="role-select-grid">
          <!-- JS로 역할 카드 동적 생성 -->
        </div>

        <button id="btn-random-role" class="w-full py-2.5 mb-2 rounded-lg bg-coal-700 hover:bg-coal-600 border border-sepia-800 text-sepia-200 text-xs font-semibold flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-dice text-vintageGold"></i>
          <span>무작위 역할로 즉시 시작</span>
        </button>
      </div>

      <div class="pt-3 border-t border-sepia-800/60 text-[11px] text-gray-400">
        <p>고등학교 2학년 세계사 수업용 인터랙티브 학습 시뮬레이션</p>
      </div>
    </section>

    <!-- 스크린 2: 라운드 스토리 및 딜레마 선택 화면 -->
    <section id="screen-round" class="hidden relative z-10 flex-1 flex flex-col justify-between p-5 overflow-y-auto custom-scroll">
      <div>
        <!-- 라운드 헤드라인 -->
        <div class="flex items-center space-x-2 text-vintageGold text-xs font-bold uppercase tracking-wider mb-2">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span id="round-title-prefix">Round 1</span>
        </div>
        <h2 id="round-headline" class="text-lg font-bold text-sepia-100 mb-3 leading-snug">
          상황 타이틀
        </h2>

        <!-- 상황 설명 카드 -->
        <div class="bg-coal-900/90 rounded-xl p-4 border border-sepia-800/80 mb-4 shadow-inner">
          <div id="round-scenario-text" class="text-xs sm:text-sm text-sepia-200 leading-relaxed space-y-2">
            <!-- 시나리오 텍스트 삽입 -->
          </div>
        </div>

        <!-- 딜레마 질문 -->
        <p class="text-xs font-semibold text-vintageGold mb-2.5 flex items-center">
          <i class="fa-solid fa-circle-question mr-1.5"></i>
          <span>당신의 결정은 무엇입니까?</span>
        </p>

        <!-- 선택지 목록 -->
        <div id="choices-container" class="space-y-2.5">
          <!-- 버튼들이 동적으로 주입됨 -->
        </div>
      </div>
    </section>

    <!-- 스크린 3: 선택 결과 피드백 및 역사 팩트 모달/창 -->
    <section id="screen-feedback" class="hidden relative z-10 flex-1 flex flex-col justify-between p-5 overflow-y-auto custom-scroll">
      <div>
        <div class="w-12 h-12 mx-auto rounded-full bg-sepia-900/80 border border-vintageGold flex items-center justify-center text-vintageGold text-xl mb-3 shadow-lg">
          <i id="feedback-icon" class="fa-solid fa-scale-balanced"></i>
        </div>
        <h3 id="feedback-title" class="text-center font-bold text-sepia-100 text-base mb-1">
          선택의 결과
        </h3>
        <p id="feedback-change-tags" class="text-center text-xs space-x-1.5 mb-4 text-gray-300">
          <!-- 스탯 변동 뱃지 -->
        </p>

        <!-- 결과 서사 -->
        <div class="bg-coal-900/90 rounded-xl p-4 border border-sepia-800 mb-3">
          <p id="feedback-story" class="text-xs sm:text-sm text-sepia-200 leading-relaxed">
            <!-- 스토리 결과 -->
          </p>
        </div>

        <!-- 실제 역사 노트 카드 -->
        <div class="bg-sepia-900/30 rounded-xl p-3.5 border border-vintageGold/30 text-sepia-300">
          <div class="flex items-center space-x-1.5 text-vintageGold text-xs font-bold mb-1">
            <i class="fa-solid fa-book-bookmark"></i>
            <span>역사 속 실제 이야기</span>
          </div>
          <p id="feedback-history" class="text-[11.5px] leading-relaxed text-gray-300">
            <!-- 역사적 사실 설명 -->
          </p>
        </div>
      </div>

      <button id="btn-next-round" class="w-full mt-4 py-3 rounded-xl bg-vintageGold text-coal-900 font-bold text-xs uppercase tracking-wider hover:bg-yellow-500 shadow-md transition active:scale-95">
        다음 라운드로 넘어가기
      </button>
    </section>

    <!-- 스크린 4: 엔딩 및 토론 디브리핑 화면 -->
    <section id="screen-ending" class="hidden relative z-10 flex-1 flex flex-col justify-between p-5 overflow-y-auto custom-scroll">
      <div>
        <div class="text-center mb-4">
          <span class="text-[11px] uppercase tracking-widest text-vintageGold font-vintage">Journey's End</span>
          <h2 id="ending-title" class="text-xl font-bold text-sepia-100 mt-1 mb-2"></h2>
          <div id="ending-badge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-coal-900 border border-sepia-800 text-vintageGold mb-3">
          </div>
        </div>

        <!-- 최종 결말 내용 -->
        <div class="bg-coal-900 rounded-xl p-4 border border-sepia-800 mb-4">
          <p id="ending-desc" class="text-xs sm:text-sm text-sepia-200 leading-relaxed mb-3"></p>
          <div class="border-t border-sepia-800 pt-2 text-[11px] text-gray-400">
            <span class="font-bold text-sepia-300">최종 도달 자원: </span>
            <span id="final-stats-summary"></span>
          </div>
        </div>

        <!-- 교실 수업용 토론 및 성찰 (현대 AI/키오스크 연결) -->
        <div class="bg-sepia-900/40 rounded-xl p-4 border border-vintageGold/40 mb-4">
          <div class="flex items-center space-x-2 text-vintageGold font-bold text-xs mb-2">
            <i class="fa-solid fa-comments"></i>
            <span>세계사 교실 토론 & 성찰 질문</span>
          </div>
          <ul id="debriefing-questions" class="text-xs text-sepia-200 space-y-2 list-disc pl-4 leading-relaxed">
            <!-- 질문 자동 생성 -->
          </ul>
        </div>

        <!-- 복사 버튼 (학생 수업용 답변 공유 편의) -->
        <button id="btn-copy-summary" class="w-full py-2.5 mb-2 rounded-lg bg-coal-700 hover:bg-coal-600 border border-sepia-800 text-sepia-200 text-xs flex items-center justify-center space-x-2 transition">
          <i class="fa-regular fa-clipboard"></i>
          <span>나의 결과 요약 복사하기 (패들렛 제출용)</span>
        </button>
        <p id="copy-toast" class="hidden text-center text-xs text-green-400 mb-2">요약이 클립보드에 복사되었습니다!</p>
      </div>

      <button id="btn-restart" class="w-full mt-2 py-3 rounded-xl bg-coal-900 hover:bg-coal-700 border border-sepia-800 text-sepia-200 font-bold text-xs transition active:scale-95">
        다른 역할로 다시 체험하기
      </button>
    </section>

  </main>

  <script>
    /* -------------------------------------------------------------
       1. 데이터 정의: 역할 (4개)
    ------------------------------------------------------------- */
    const ROLES = {
      tom: {
        id: 'tom',
        name: '톰 (11세)',
        title: '아동 노동자',
        icon: 'fa-child-reaching',
        desc: '하루 16시간 동안 멈추지 않는 증기 방적기 밑으로 기어들어가 끊어진 실밥을 잇는 피어서(Piercer) 소년.',
        initialStats: { stat1: 75, stat2: 25, stat3: 45 },
        statNames: { stat1: '체력/생존', stat2: '임금(식비)', stat3: '공포/스트레스' },
        statColors: { stat1: 'bg-rustRed', stat2: 'bg-vintageGold', stat3: 'bg-steamBlue' }
      },
      william: {
        id: 'william',
        name: '윌리엄 (40세)',
        title: '숙련 수공업 직조공',

        desc: '가내 수공업으로 가문의 긍지를 지켜왔으나, 증기 역직기의 보급으로 생계가 벼랑 끝에 몰린 장인.',
        initialStats: { stat1: 65, stat2: 35, stat3: 70 },
        statNames: { stat1: '가계 안정도', stat2: '자금', stat3: '분노/저항심' },
        statColors: { stat1: 'bg-emerald-600', stat2: 'bg-vintageGold', stat3: 'bg-rustRed' }
      },
      james: {
        id: 'james',
        name: '제임스 (48세)',
        title: '신흥 방적 공장주',
        icon: 'fa-user-tie',
        desc: '막대한 은행 빚과 증기 설비 투자를 감행한 자본가. 해외 수출 경쟁에서 지면 하루아침에 파산할 수 있다.',
        initialStats: { stat1: 50, stat2: 85, stat3: 40 },
        statNames: { stat1: '사회적 평판', stat2: '공장 자본', stat3: '공장 리스크' },

      },
      mary: {
        id: 'mary',

        icon: 'fa-person-dress',
        desc: '맨체스터의 습한 지하 단칸방에서 결핵을 앓는 갓난아이를 홀로 돌보며 방적 공장 야간조로 일하는 여성.',
        initialStats: { stat1: 60, stat2: 30, stat3: 50 },
        statNames: { stat1: '가족 건강', stat2: '생계 자금', stat3: '절망/한계' },
        statColors: { stat1: 'bg-rustRed', stat2: 'bg-vintageGold', stat3: 'bg-steamBlue' }
      }
    };

    /* -------------------------------------------------------------
       2. 라운드별 시나리오 & 선택지 & 역사 노트
    ------------------------------------------------------------- */
    const SCENARIOS = {
      1: {
        roundTitle: "Round 1. 공장의 하루와 생존의 기로",
        theme: "가속화되는 기계 속도와 장시간 노동",
        stories: {
          tom: {
            scenario: "감독관이 방적기의 회전 속도를 1.5배로 올렸습니다. 기계가 굉음을 내며 빠르게 돌아가고, 실이 엉킬 때마다 벨트 밑으로 몸을 욱여넣어야 합니다. 졸음이 쏟아집니다.",

              {

              },
              {
                text: "너무 위험하니 잠시 기둥 뒤에서 쉬며 속도를 늦춘다.",
                stats: { stat1: +10, stat2: -20, stat3: +25 },
                story: "감독관의 무거운 가죽 채찍이 등을 강타했습니다. '게으름을 피웠다'며 이번 주 일당 절반이 깎였습니다.",
                history: "당시 공장 감독관들은 아동들의 졸음을 막기 위해 매질과 체벌을 가했으며, 이를 '오버루커의 채찍질'이라 불렀습니다."
              }
            ]
          },
          william: {

            choices: [
              {

              },
              {
                text: "수공업을 포기하고 증기 공장의 단순 기계공으로 취업을 알아본다.",

              }
            ]
          },
          james: {
            scenario: "경쟁사에서 최신형 고속 증기 기관을 도입해 생산성을 40% 끌어올렸다는 소식이 들립니다. 공장 가동률을 극대화하지 않으면 이번 분기 만기 어음을 막을 수 없습니다.",
            choices: [
              {
                text: "기계 안전 덮개 설치를 미루고 전면 야간 연속 조업을 명령한다.",

    /* -------------------------------------------------------------
       4. 애플리케이션 상태 관리
    ------------------------------------------------------------- */
    const state = {
      role: null,

      stats: { stat1: 50, stat2: 50, stat3: 50 },

    // DOM 요소 캐싱
    const elements = {
      hud: document.getElementById('game-hud'),

    /* -------------------------------------------------------------
       5. 컨트롤러 및 렌더링 함수
    ------------------------------------------------------------- */

    // 시작 화면 역할 카드 초기화
    function initStartScreen() {
      elements.roleGrid.innerHTML = '';
      Object.values(ROLES).forEach(r => {
        const card = document.createElement('button');
        card.className = "flex flex-col p-3 rounded-xl bg-coal-900/90 border border-sepia-800 hover:border-vintageGold text-left transition active:scale-95 group";
        card.innerHTML = `
          <div class="flex items-center space-x-2 mb-1.5">
            <span class="w-6 h-6 rounded bg-coal-700 flex items-center justify-center text-vintageGold group-hover:bg-vintageGold group-hover:text-coal-900 transition text-xs">
              <i class="fa-solid ${r.icon}"></i>
            </span>
            <span class="text-xs font-bold text-sepia-100">${r.name}</span>
          </div>
          <p class="text-[11px] font-semibold text-vintageGold mb-1">${r.title}</p>
          <p class="text-[10px] text-gray-400 leading-tight line-clamp-2">${r.desc}</p>
        `;
        card.onclick = () => startGameWithRole(r.id);
        elements.roleGrid.appendChild(card);
      });
    }

    // 게임 시작
    function startGameWithRole(roleId) {
      const selected = ROLES[roleId];
      state.role = selected;
      state.currentRound = 1;
      state.stats = { ...selected.initialStats };
      state.choicesHistory = [];

      // HUD 설정
      elements.hudRoleIcon.className = `fa-solid ${selected.icon} text-vintageGold text-sm`;
      elements.hudRoleName.textContent = `${selected.name} (${selected.title})`;
      elements.stat1Name.textContent = selected.statNames.stat1;
      elements.stat2Name.textContent = selected.statNames.stat2;
      elements.stat3Name.textContent = selected.statNames.stat3;

      elements.stat1Bar.className = `${selected.statColors.stat1} h-full transition-all duration-500`;
      elements.stat2Bar.className = `${selected.statColors.stat2} h-full transition-all duration-500`;
      elements.stat3Bar.className = `${selected.statColors.stat3} h-full transition-all duration-500`;

      updateHUD();
      elements.hud.classList.remove('hidden');

      showScreen('round');
      renderRound();
    }

    // HUD 업데이트
    function updateHUD() {
      // 0~100 clamp
      ['stat1', 'stat2', 'stat3'].forEach(k => {
        state.stats[k] = Math.max(0, Math.min(100, state.stats[k]));
      });

      elements.stat1Val.textContent = state.stats.stat1;
      elements.stat2Val.textContent = state.stats.stat2;
      elements.stat3Val.textContent = state.stats.stat3;

      elements.stat1Bar.style.width = `${state.stats.stat1}%`;
      elements.stat2Bar.style.width = `${state.stats.stat2}%`;
      elements.stat3Bar.style.width = `${state.stats.stat3}%`;

      elements.hudRoundLabel.textContent = `Round ${state.currentRound} / 4`;
    }

    // 화면 전환 헬퍼
    function showScreen(screenName) {
      ['start', 'round', 'feedback', 'ending'].forEach(name => {
        const el = elements[`screen${name.charAt(0).toUpperCase() + name.slice(1)}`];
        if (name === screenName) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
      // 스크롤 상단 초기화
      const appContainer = document.getElementById('app-container');
      const activeScreen = elements[`screen${screenName.charAt(0).toUpperCase() + screenName.slice(1)}`];
      if (activeScreen) activeScreen.scrollTop = 0;
    }

    // 라운드 렌더링
    function renderRound() {
      const roundData = SCENARIOS[state.currentRound];
      const roleStory = roundData.stories[state.role.id];

      elements.roundTitlePrefix.textContent = `Round ${state.currentRound}`;
      elements.roundHeadline.textContent = roundData.roundTitle.split('. ')[1] || roundData.roundTitle;
      elements.roundScenarioText.innerHTML = `<p>${roleStory.scenario}</p>`;

      // 선택지 버튼 생성
      elements.choicesContainer.innerHTML = '';
      roleStory.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 rounded-xl bg-coal-900 border border-sepia-800 hover:border-vintageGold active:scale-[0.98] transition flex flex-col justify-between";
        btn.innerHTML = `
          <div class="flex items-start space-x-2.5">
            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-sepia-900 text-vintageGold text-[11px] font-bold shrink-0 mt-0.5">
              ${index + 1}
            </span>
            <span class="text-xs sm:text-sm text-sepia-100 font-medium leading-relaxed">${choice.text}</span>
          </div>
        `;
        btn.onclick = () => handleChoice(choice);
        elements.choicesContainer.appendChild(btn);
      });
    }

    // 선택 처리
    function handleChoice(choice) {
      // 스탯 반영
      const diff1 = choice.stats.stat1;
      const diff2 = choice.stats.stat2;
      const diff3 = choice.stats.stat3;

      state.stats.stat1 += diff1;
      state.stats.stat2 += diff2;
      state.stats.stat3 += diff3;
      updateHUD();

      // 히스토리 기록
      state.choicesHistory.push({
        round: state.currentRound,
        choiceText: choice.text,
        story: choice.story
      });

      // 피드백 화면 구성
      renderFeedback(choice, diff1, diff2, diff3);
      showScreen('feedback');
    }

    // 수치 변동 포맷 헬퍼
    function formatStatTag(name, diff) {
      if (diff === 0) return '';
      const isPositive = diff > 0;
      const sign = isPositive ? `+${diff}` : `${diff}`;
      const color = isPositive ? 'text-green-400 bg-green-950/60 border-green-800' : 'text-rose-400 bg-rose-950/60 border-rose-800';
      return `<span class="inline-block px-2 py-0.5 rounded text-[11px] border ${color}">${name} ${sign}</span>`;
    }

    // 피드백 렌더링
    function renderFeedback(choice, d1, d2, d3) {
      const r = state.role;
      let tagsHtml = '';
      tagsHtml += formatStatTag(r.statNames.stat1, d1);
      tagsHtml += formatStatTag(r.statNames.stat2, d2);
      tagsHtml += formatStatTag(r.statNames.stat3, d3);

      elements.feedbackChangeTags.innerHTML = tagsHtml || '<span class="text-gray-400 text-xs">수치 변동 없음</span>';
      elements.feedbackStory.textContent = choice.story;
      elements.feedbackHistory.textContent = choice.history;

      if (state.currentRound >= 4) {
        elements.btnNextRound.textContent = "최종 결말 및 디브리핑 확인";
      } else {
        elements.btnNextRound.textContent = `Round ${state.currentRound + 1}로 넘어가기`;
      }
    }

    // 엔딩 계산 및 렌더링
    function renderEnding() {
      elements.hud.classList.add('hidden');
      const rId = state.role.id;
      const s = state.stats;

      // 엔딩 결정
      let finalEnding = ENDINGS[ENDINGS.length - 1]; // 기본
      for (const ending of ENDINGS) {
        if (ending.condition(rId, s.stat1, s.stat2, s.stat3)) {
          finalEnding = ending;
          break;
        }
      }

      elements.endingBadge.textContent = finalEnding.badge;
      elements.endingTitle.textContent = finalEnding.title;
      elements.endingDesc.textContent = finalEnding.desc;
      elements.finalStatsSummary.textContent = `${state.role.statNames.stat1}: ${s.stat1} | ${state.role.statNames.stat2}: ${s.stat2} | ${state.role.statNames.stat3}: ${s.stat3}`;

      // 수업용 토론 질문 구성 (고2 세계사 + 현대 AI 및 키오스크 연계)
      elements.debriefingQuestions.innerHTML = `
        <li><strong>역지사지 관점:</strong> 내가 맡은 인물(${state.role.name})의 입장에서 생존과 이익을 위해 어쩔 수 없었던 최선의 선택은 무엇이었나요?</li>
        <li><strong>러다이트의 재조명:</strong> 19세기 직조공들의 기계 파괴는 단순한 '발전 거부'였을까요, 아니면 생존을 위한 마지막 '저항'이었을까요?</li>
        <li><strong>현대 사회와의 연결:</strong> 오늘날 식당과 매장의 <strong>'키오스크·무인 결제'</strong>나 <strong>'생성형 AI'</strong> 도입으로 일자리를 잃거나 소외를 겪는 사람들의 문제는 1830년 맨체스터의 모습과 어떻게 닮아 있나요?</li>
        <li><strong>해결책 모색:</strong> 기술의 발전이 모든 인간에게 축복이 되도록 하려면, 오늘날 우리는 어떤 법(공장법처럼)이나 사회적 제도를 마련해야 할까요?</li>
      `;

      showScreen('ending');
    }

    /* -------------------------------------------------------------
       6. 이벤트 리스너 등록
    ------------------------------------------------------------- */
    // 랜덤 배정 버튼
    elements.btnRandomRole.addEventListener('click', () => {
      const keys = Object.keys(ROLES);
      const randKey = keys[Math.floor(Math.random() * keys.length)];
      startGameWithRole(randKey);
    });

    // 다음 라운드 버튼
    elements.btnNextRound.addEventListener('click', () => {
      if (state.currentRound < 4) {
        state.currentRound++;
        updateHUD();
        showScreen('round');
        renderRound();
      } else {
        renderEnding();
      }
    });

    // 다시 하기 버튼
    elements.btnRestart.addEventListener('click', () => {
      elements.hud.classList.add('hidden');
      showScreen('start');
    });

    // 패들렛 제출용 텍스트 복사 (execCommand 사용)
    elements.btnCopySummary.addEventListener('click', () => {
      const summaryText = `[1830 맨체스터 시뮬레이션 결과 보고서]
- 역할: ${state.role.name} (${state.role.title})
- 최종 결말: ${elements.endingTitle.textContent}
- 최종 수치: ${elements.finalStatsSummary.textContent}
- 나의 성찰: 1830년 맨체스터의 기계화와 오늘날 AI·키오스크 자동화는 인간의 존엄성과 일자리라는 측면에서 매우 유사한 고민을 던져줍니다.`;

      const tempTextArea = document.createElement('textarea');
      tempTextArea.value = summaryText;
      tempTextArea.style.position = 'fixed';
      tempTextArea.style.opacity = '0';
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          elements.copyToast.classList.remove('hidden');
          setTimeout(() => elements.copyToast.classList.add('hidden'), 3000);
        }
      } catch (err) {
        console.error('복사 실패', err);
      } finally {
        document.body.removeChild(tempTextArea);
      }
    });

    // 초기 실행
    window.onload = function() {
      initStartScreen();
    };
  </script>
</body>
</html>
